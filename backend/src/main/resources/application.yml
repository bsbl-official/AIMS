spring:
  application:
    name: aims-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/account_bm}
    username: ${DB_USERNAME:account_bm}
    password: ${DB_PASSWORD:account_bm}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:account-bm-api}
    audience: ${JWT_AUDIENCE:account-bm-web}
    secret: ${JWT_SECRET:account-bm-development-secret-change-before-production}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    admin-email: ${SUPER_ADMIN_EMAIL:admin@accountbm.local}
    admin-password: ${SUPER_ADMIN_PASSWORD:ChangeMe123!}
    admin-name: ${SUPER_ADMIN_NAME:System Administrator}
  security:
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:account-bm-development-mfa-key-change-me}
