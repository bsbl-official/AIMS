spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    secret: ${JWT_SECRET}
  auth-cookie:
    secure: true
    same-site: Strict
  bootstrap:
    enabled: false
    admin-email: disabled@example.invalid
    admin-password: disabled
    admin-name: Disabled
  security:
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY}
