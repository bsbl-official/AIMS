name: account_bm

services:
  postgres:
    image: postgres:18-alpine
    container_name: account_bm_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-account_bm}
      POSTGRES_USER: ${DB_USERNAME:-account_bm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-account_bm}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - account-bm-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - account-bm-network

  backend:
    image: account_bm_backend
    container_name: account_bm_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-account_bm}
      DB_USERNAME: ${DB_USERNAME:-account_bm}
      DB_PASSWORD: ${DB_PASSWORD:-account_bm}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      JWT_ISSUER: ${JWT_ISSUER:-account-bm-api}
      JWT_SECRET: ${JWT_SECRET:-account-bm-development-secret-change-before-production}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@accountbm.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-System Administrator}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - account-bm-network

  frontend:
    image: account_bm_frontend
    container_name: account_bm_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - account-bm-network

volumes:
  account-bm-postgres:

networks:
  account-bm-network:
    name: account_bm_network
    driver: bridge
