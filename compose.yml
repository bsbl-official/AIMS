name: account_bm

services:
  backend:
    image: account_bm_backend
    container_name: account_bm_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://host.docker.internal:5432/${DB_NAME:-account_bm}
      DB_USERNAME: ${DB_USERNAME:-account_bm}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      JWT_ISSUER: ${JWT_ISSUER:-account-bm-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-account-bm-web}
      JWT_SECRET: ${JWT_SECRET:-account-bm-development-secret-change-before-production}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-local-development-mfa-key-change-me}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@accountbm.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-System Administrator}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - account-bm-network

  frontend:
    image: account_bm_frontend
    container_name: account_bm_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - account-bm-network

networks:
  account-bm-network:
    name: account_bm_network
    driver: bridge
